# The program: shows, on/off windows and defaults. Tracked in git, so it
# travels with the effects. Edited by the dashboard (Save & apply) or by hand;
# the runner reloads it a few seconds after it changes. Machine settings
# (wled:, location:) live in the git-ignored config.yaml / data/config.yaml.
schedule:
  # Times: "HH:MM", or sunrise / sunset / dawn / dusk / noon with an optional
  # offset, e.g. "sunset - 15m", "sunrise + 1h30m". An off time at or before
  # the on time means the next day (e.g. off: "01:00").
  default_show: evening
  windows:
    - on: sunrise - 15m          # sunrise effect: the sun comes up 15 min in, on time
      off: sunrise + 15m
      show: morning
    - on: sunset - 15m           # sunset effect first: the sun goes down 15 min in, on time
      off: "20:38"
      show: evening
  brightness: 160              # WLED master brightness sent at on-time (0-255). Affects wled:<id> presets
                               # and WLED's fallback only; it does NOT dim DDP shows on this setup.
  scale: 0.64                  # brightness of DDP shows (0-1); the only dimmer for them

  # Rotation: show names from shows/, or wled:<preset id> to hand over to a
  # WLED preset (DDP stops while it runs). Per-entry minutes override minutes_each;
  # once: true plays an entry on the show's first pass only, not when it repeats.
  minutes_each: 10
  shuffle: false
  transition_seconds: 2        # crossfade between DDP shows (0 = hard cut)
  reassert_on: false           # every minute, turn WLED back on if something turned it off mid-window
shows:
  morning:
    effects:
      - {effect: sunrise, minutes: 30, once: true}
  evening:
    effects:
      - {effect: sunset, minutes: 30, once: true}
      - rainbow_helix
      - sequence
      - ring_spin
      - strand_flow
      - firework
      - {effect: twinkle, minutes: 10}
      - wled:1
      - wled:2
  evening-more-stuff:
    effects:
      - {effect: sunset, minutes: 30, once: true}
      - rainbow_helix
      - snow
      - ring_spin
      - strand_flow
      - firework
      - {effect: swarm, minutes: 10}
      - wled:1
      - sandworm
      - wled:2
