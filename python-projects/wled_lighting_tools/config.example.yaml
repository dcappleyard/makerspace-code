# Machine settings. Copy to config.yaml (git-ignored; data/config.yaml in Docker) and set
# the real host. The shows and schedule are in program/program.yaml (tracked in git).
wled:
  host: 192.168.1.50           # IP of the Dig-Uno (use a DHCP reservation; .local mDNS
                               # names don't resolve inside Docker, but work from a laptop)
  ddp_port: 4048
  fps: 40
  # api_port: 80               # WLED JSON API port (only change for testing)

location:                      # for sunrise/sunset (astral)
  name: Madison
  latitude: 43.07
  longitude: -89.40
  timezone: America/Chicago

# Optional add-on: a second Dig-Uno with the tree strand (tree_map.py -> tree_pixels.csv).
# Effects with a tree companion (render_tree) play on it too; others leave it dark.
# Leave the tree's WLED off; the runner streams to it during windows. Delete the
# block (or leave it commented) to run the sculpture alone.
