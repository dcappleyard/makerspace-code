# Copy to <DATA_DIR>/devices.yaml (./data/devices.yaml with docker compose).
# Static per-device config; runtime state (playlist, battery, ...) lives in db.sqlite.
timezone: America/Chicago

devices:
  - id: living_room_73          # our name for the frame; used in URLs/UI
    name: Living room 7.3"
    protocol: bloomin8          # server/protocols/<name>.py
    pipeline: bloomin8_spectra6 # server/pipelines/<module>.py, by its `name`
    width: 800                  # as mounted on the wall
    height: 480
    # Rotation (degrees clockwise) applied after cropping, before encoding.
    # The reference server stores landscape images rotated 90 (portrait-shaped
    # file, still named _L.jpg). Confirm on the real panel and adjust.
    output_rotation: 90
    # Sent by the frame as X-Access-Token; also identifies the device.
    # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(24))"
    token: CHANGE_ME_TOKEN
    # Path secret in image URLs (the frame may not send the header for the download).
    image_secret: CHANGE_ME_IMAGE_SECRET
    # Default schedule, used until you add blocks on the frame's tab: play the
    # playlist every interval_minutes during wake_hours, sleep outside them.
    interval_minutes: 120
    wake_hours: ["07:00", "22:00"]  # local
    # Battery % in the image's upper-right corner (as mounted), from the frame's
    # latest report: none (no battery monitor), always, or low (only below 10%).
    # Below 10% it's red on colour panels, otherwise black.
    battery_monitor: always
    # Caption from the photo's sidecar (title · location · film / artist ‡ date),
    # rendered into the image: none, overlay_bottom (over the photo), or
    # below_strip (strip frames). caption_size = px of the smaller text.
    captions: none
    tuning:                     # overrides the pipeline's defaults; per-photo overrides win
      saturation: 1.2           # 1.0 = unchanged
      contrast: 1.1
      brightness: 1.0
      gamma: 1.0                # luma only; <1 darkens midtones, >1 lightens
      lift: 0                   # soft shadow lift (0 = off; ~10-15 to open up shadows)
      lift_threshold: 90        # luma below which lift applies
      quality: 92               # JPEG quality sent to the frame

  # The DIY EE03 10.3" panorama frame (esp32-projects/xiao_s3_ee03_pull_frame).
  # Its secrets.h holds the same token and this server's URL.
  - id: office_panorama
    name: Office panorama
    protocol: esp32_pull
    pipeline: ee03_gray16
    width: 1872
    height: 1404
    output_rotation: 0
    token: CHANGE_ME_TOKEN_2
    image_secret: CHANGE_ME_IMAGE_SECRET_2
    battery_monitor: none          # mains powered
    captions: below_strip          # under the strip; overlay_bottom = on the photo's bottom edge
    options:
      strip_height: 661            # 6:17 panorama strip; 778 = the prepare_image_778 look
      fit: letterbox               # letterbox (full width) or cover (fill the strip)
    interval_minutes: 120
    wake_hours: ["07:00", "22:00"]
    tuning:
      contrast: 1.0
      gamma: 1.0
      lift: 0
