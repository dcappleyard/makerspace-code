<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#222; --muted:#777; --line:#ddd; --accent:#2a6; --warn:#c63; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:24px 0 8px; } h3 { font-size:15px; margin:0; }
  .muted { color:var(--muted); } .warn { color:var(--warn); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .status { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:4px 16px; margin:8px 0; }
  table { border-collapse:collapse; width:100%; } td { padding:4px 6px; border-top:1px solid var(--line); vertical-align:middle; }
  img.t { height:48px; border-radius:3px; display:block; }
  input[type=time] { width:7.5em; } input.num { width:4.5em; }
  button { cursor:pointer; padding:3px 8px; } form { display:inline; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .focal { position:relative; cursor:crosshair; }
  .focal img { width:100%; display:block; border-radius:4px; }
  .focal .dot { position:absolute; width:12px; height:12px; margin:-6px; border:2px solid #fff; border-radius:50%; box-shadow:0 0 0 1px #000; pointer-events:none; }
  .previews { display:flex; gap:8px; flex-wrap:wrap; } .previews img { max-width:min(400px,100%); border:1px solid var(--line); }
  nav { display:flex; gap:16px; align-items:baseline; margin-bottom:8px; }
  nav a { color:var(--ink); text-decoration:none; padding-bottom:2px; } nav a.on { border-bottom:2px solid var(--ink); font-weight:600; }
  .banner-error { background:#fbe3da; border:1px solid var(--warn); color:#7a2e12; padding:8px 12px; border-radius:6px; }
  .chip { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:var(--line); color:var(--ink); text-decoration:none; margin:1px 2px; }
  .chip.on { background:var(--ink); color:var(--card); }
  .tagbar { margin-bottom:8px; } .meta-title { font-weight:600; margin-top:4px; } .meta-sub { color:var(--muted); font-size:13px; }
  .metaform label { display:block; font-size:13px; margin:3px 0; } .metaform input { width:100%; }
</style>
