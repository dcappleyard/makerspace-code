[env:ee03]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino

upload_speed = 115200
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -I lib/driver

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git