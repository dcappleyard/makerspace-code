[env:xiao_s3_sense_webcam]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
# The Sense variant: XIAO ESP32-S3 (8MB flash, 8MB OPI PSRAM) plus the
# camera/microSD expansion board -- see ../hardware_info.md. The board JSON
# already sets qio_opi memory, BOARD_HAS_PSRAM and default_8MB.csv (whose app0
# is ota_0, so PlatformIO's upload-size check is real -- see the note in
# ../xiao_s3_ee03_pull_frame/platformio.ini for why that matters). The spiffs
# partition in that table is unused: the web UI is compiled in (src/index_html.h).
board = seeed-xiao-esp32-s3-sense
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -I lib/driver

# esp_camera.h (espressif/esp32-camera) and esp_http_server.h ship with the
# core. Seeed_GFX drives the 1.28" round touch display; lib/driver/driver.h
# selects it (BOARD_SCREEN_COMBO 501).
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
