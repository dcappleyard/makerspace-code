[env:panorama_photo_frame_web]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
# The hardware is a XIAO ESP32-S3 *Plus* (16MB flash), not the Sense variant the
# sibling projects name -- see ../hardware_info.md, which corrected that. The
# Plus variant header is purely additive over the base one (adds MOSI1/MISO1/
# SCK1, D11-D16, and ADC_BAT/BAT_VOLT_PIN); nothing this project uses is
# redefined, so the switch is safe and the partition table below can address
# more than 8MB.
board = seeed-xiao-esp32-s3-plus
framework = arduino

upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

# NOTE on the partition table: app0's subtype is `ota_0`, not `factory`, and
# that is load-bearing. PlatformIO's _update_max_upload_size() (in the Seeed
# platform's builder/board_build/esp/esp_build.py) only lowers
# upload.maximum_size for a partition whose subtype is `ota_0` (or one named by
# board_build.app_partition_name). With `factory`, the size limit stays at the
# board JSON's full flash size, so an over-large firmware builds and flashes
# "successfully" and then fails to boot with no warning. `ota_0` makes the size
# check real -- worth knowing, since this build links the whole WiFi stack.
#
# Dropped from the sibling project's config, deliberately:
#  - `upload_flags = --no-stub`: its whole justification was the ~6.9MB spiffs
#    erase during `uploadfs` tripping a reset over native USB-CDC. There is no
#    filesystem partition here (images live on the SD card), so `uploadfs`
#    doesn't exist and the app-only write is short. If uploads ever turn flaky,
#    re-adding this is the first thing to try.
#  - `board_build.filesystem = littlefs`: no filesystem partition, no data/ dir.

build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -I lib/driver

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
