[env:panorama_photo_frame_w_counter]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-s3-sense
framework = arduino

upload_speed = 115200
monitor_speed = 115200

# --no-stub: the filesystem image upload does one large upfront erase
# (~6.9MB spiffs partition) before writing. On this board that erase appears
# to run long enough to trip a reset mid-erase over the native USB-CDC link
# ("chip stopped responding" at 0 bytes written, every time). --no-stub skips
# esptool's flasher stub and talks to the ROM bootloader directly instead,
# which uses a different (slower, but more conservative) erase/write path.
# Note: --no-stub is a global esptool option (valid before the write_flash
# subcommand); --no-compress is NOT -- it's write_flash-specific and
# PlatformIO inserts upload_flags before the subcommand, so passing
# --no-compress here breaks esptool's arg parsing entirely (confirmed: it
# also broke the plain firmware `upload` target, since upload_flags applies
# to both targets).
upload_flags =
    --no-stub

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -I lib/driver

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
