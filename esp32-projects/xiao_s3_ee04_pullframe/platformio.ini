# Two EE04 frames, one source tree. Each [env:frameN] builds the same firmware
# with its own FRAME_SLOT, which picks that frame's DEVICE_TOKEN in
# include/secrets.h (and its hostname). Always name the board you're flashing:
#
#   pio run -e frame1 -t upload
#   pio run -e frame2 -t upload
#
# default_envs is frame1 so a bare `pio run -t upload` doesn't flash both
# envs to the same board one after the other.
[platformio]
default_envs = frame1

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
# The EE04 ships with a XIAO ESP32-S3 Plus; its D11/D16 pins (panel RST/DC)
# only exist in the Plus variant header.
board = seeed-xiao-esp32-s3-plus
framework = arduino

upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -I src
    -I lib/driver

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    # Parses the eink_photo_server's pull responses (MIT).
    bblanchon/ArduinoJson@^7

[env:frame1]
build_flags =
    ${env.build_flags}
    -D FRAME_SLOT=1
    -D FRAME_HOSTNAME=\"ee04-frame-1\"

[env:frame2]
build_flags =
    ${env.build_flags}
    -D FRAME_SLOT=2
    -D FRAME_HOSTNAME=\"ee04-frame-2\"
